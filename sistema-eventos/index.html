<!doctype html>

<html lang="pt-BR">

    <meta charset="UTF-8" />

    <!-- Faz o layout se adaptar corretamente em celulares -->

    <!-- Cor usada pelo navegador e pelo PWA -->

    <!-- Ícone exibido na aba do navegador -->

    <!-- Título exibido na aba do navegador -->

  </head>

  <body>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
